name: mobile
description: A secure, geo-fenced mobile attendance client.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  geolocator: ^12.0.0
  local_auth: ^2.2.0
  device_info_plus: ^10.1.0
  ntp: ^2.0.0
  dio: ^5.4.0
  intl: ^0.19.0
  logger: ^2.4.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  connectivity_plus: ^5.0.0
  # Offline DB (replaces SharedPreferences for punch queue)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  # Secure storage for API key
  flutter_secure_storage: ^9.2.2
  # Idempotency UUIDs for offline punches
  uuid: ^4.4.0
  package_info_plus: ^9.0.1
  version: ^3.0.2
  flutter_jailbreak_detection: ^1.10.0
  # QR Code scanning (optional, toggle in settings)
  mobile_scanner: ^6.0.0
  # NFC tag reading (optional, toggle in settings)
  nfc_manager: ^3.4.0
  # Selfie / Face Verification (Phase 5a)
  image_picker: ^1.1.0
  # Push Notifications (Firebase Cloud Messaging)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  # Drift code generation
  drift_dev: ^2.22.0
  build_runner: ^2.4.0
  mockito: ^5.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.jpeg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
